  attacks: REQUIRED_FROM_DESIGN                     # e.g. important_instructions only, or more
  user_tasks: REQUIRED_FROM_DESIGN                  # all 16, or a pre-registered subset
  injection_tasks: REQUIRED_FROM_DESIGN             # all 9, or a pre-registered subset
models:
