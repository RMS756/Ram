  # Instruction-pattern set (CH3 Sec. 3.5: imperative instructions addressed to an
  # assistant, references to tool names, role or delimiter markers). DECLARED.
  # Disclosure: the author of these patterns knew the AgentDojo templates; the
  # cross-template check and the context-evidence ablation test this risk.
  instruction_patterns:
    - '(?i)\b(you|assistant|ai|model|agent)\b[^.\n]{0,40}\b(must|should|need to|have to|are required to)\b'
    - '(?i)\b(ignore|disregard|forget)\b[^.\n]{0,30}\b(previous|prior|above|earlier|all)\b[^.\n]{0,20}\b(instructions?|tasks?|prompts?)\b'
    - '(?i)\bbefore (you|completing|solving|doing)\b'
    - '(?i)<\s*/?\s*(information|instructions?|system|important|im_start|im_end)\s*>|\[(system|inst)\]|###\s*(instruction|system)'
    - '(?i)\bimportant (message|instructions?|note)\b'
